name: pnpm prior-head snapshot control
on:
  push:
    branches: [rksharma-owg/pnpm-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest]
        sha: [7ecd1db7c379fa13b8260cdcb26325edd4fc42e1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CD_DETECTOR_EXPERIMENTS: 1
      PipReportSkipFallbackOnFailure: 'true'
      PIP_INDEX_URL: https://pypi.python.org/simple
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: validation
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - name: Verify exact code and unpack immutable upstream baseline
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          git log -1 --format=%H
          python - <<'PYCODE'
          import hashlib,json,os,pathlib,zipfile
          key=os.environ['MATRIX_OS'].split('-')[0]
          root=pathlib.Path('validation/.github/preflight-baselines')
          metadata=json.loads((root/'provenance.json').read_text())[key]
          archive=root/f'snapshot-{key}.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==metadata['sha256']
          print('UPSTREAM BASELINE',json.dumps(metadata))
          with zipfile.ZipFile(archive) as z: z.extractall('release-output')
          pathlib.Path('output').mkdir()
          PYCODE
      - name: Restore
        run: dotnet restore
      - name: Install Apache Ivy Linux
        if: runner.os == 'Linux'
        shell: bash
        run: curl -fsSL https://archive.apache.org/dist/ant/ivy/2.5.3/apache-ivy-2.5.3-bin.tar.gz | tar xOz apache-ivy-2.5.3/ivy-2.5.3.jar > /usr/share/ant/lib/ivy.jar
      - name: Install Apache Ivy Windows
        if: runner.os == 'Windows'
        shell: bash
        run: curl -fsSL https://archive.apache.org/dist/ant/ivy/2.5.3/apache-ivy-2.5.3-bin.tar.gz | tar xOz apache-ivy-2.5.3/ivy-2.5.3.jar > "$ANT_HOME/lib/ivy.jar"
      - name: Install Apache Ivy macOS
        if: runner.os == 'macOS'
        run: brew install ivy
      - name: Scan verification resources with upstream arguments
        working-directory: src/Microsoft.ComponentDetection
        run: >-
          dotnet run scan --Verbosity Verbose
          --SourceDirectory ${{ github.workspace }}/test/Microsoft.ComponentDetection.VerificationTests/resources
          --Output ${{ github.workspace }}/output
          --DockerImagesToScan "docker.io/library/debian@sha256:9b0e3056b8cd8630271825665a0613cc27829d6a24906dc0122b3b4834312f7d,mcr.microsoft.com/cbl-mariner/base/core@sha256:c1bc83a3d385eccbb2f7f7da43a726c697e22a996f693a407c35ac7b4387cd59,docker.io/library/alpine@sha256:1304f174557314a7ed9eddb4eab12fed12cb0cd9809e4c28f29af86979a3c870"
          --DetectorArgs DockerReference=EnableIfDefaultOff,SPDX22SBOM=EnableIfDefaultOff
          --MaxDetectionThreads 5
          --DirectoryExclusionList "**/pip/parallel/**;**/pip/roots/**;**/pip/pre-generated/**;**/pip/fallback/**;**/pip/index-removal/**;**/pip/simple-extras/**;**/pip/pytestresultpkg/**"
      - name: Verify output against upstream snapshot
        working-directory: test/Microsoft.ComponentDetection.VerificationTests
        run: dotnet test
        env:
          GITHUB_OLD_ARTIFACTS_DIR: ${{ github.workspace }}/release-output
          GITHUB_NEW_ARTIFACTS_DIR: ${{ github.workspace }}/output
          ALLOWED_TIME_DRIFT_RATIO: '.75'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: snapshot-${{ matrix.os }}-${{ matrix.sha }}
          path: |
            output/**
            test/**/TestResults/**
